# 프로젝트 ruff 설정. 공유 설정(numpy)을 extend 한다.
# target-version 은 pyproject.toml 의 requires-python 에서 읽는다.

# .ruff/ 는 공유 설정 복사본이다. 직접 고치지 않고, 이 레포 고유 규칙은 이 파일에 둔다.
extend = ".ruff/numpy.toml"

[lint.flake8-tidy-imports.banned-api]
# 이 표는 공유 설정의 같은 표를 덮어쓴다 (numpy.toml 은 이 표가 없다).
# 모듈은 제품 레포를 import 하지 않는다 — 제품 쪽 일(웹 · 설정 파일 · LLM 호출)도 하지 않는다
"fastapi".msg = "웹 API 는 제품 레포의 일이다."
"pydantic".msg = "검증 경계는 제품 레포에 둔다. 모듈 결과는 @dataclass(frozen=True)."
"yaml".msg = "설정 파일은 제품 레포가 읽어 인자로 넘긴다."
"ollama".msg = "LLM 호출은 제품이 playground_llm 으로 한다."
"openai".msg = "LLM 호출은 제품이 playground_llm 으로 한다."
"playground_wiki".msg = "모듈은 제품 레포를 import 하지 않는다."
"playground_rag".msg = "옛 패키지 이름. playground_retrieval 을 쓴다."

[lint.isort]
known-first-party = ["playground_retrieval"]

[lint.extend-per-file-ignores]
# 디렉터리 패턴은 이 파일(프로젝트 루트) 기준.
"tests/**/*.py" = ["S101", "D", "ANN", "PLR2004", "S106", "S105"]
"bench/**/*.py" = ["T20", "D", "PLC0415"]
# 수치 계산: 논문 표기 변수명 · 계산식 안 숫자 리터럴 허용
"**/eval/ann_bench.py" = ["N803", "N806", "PLR2004"]
